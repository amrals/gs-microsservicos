services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: zelourbano-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "YourStrong!Passw0rd"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong!Passw0rd' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  init-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    command: >
      /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'YourStrong!Passw0rd' -C -Q "IF NOT EXISTS (SELECT * FROM sys.databases WHERE name = 'zelourbano_db') CREATE DATABASE zelourbano_db;"

  api:
    build: .
    container_name: zelourbano-api
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DB_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=zelourbano_db;encrypt=true;trustServerCertificate=true"
      DB_USERNAME: "sa"
      DB_PASSWORD: "YourStrong!Passw0rd"
    depends_on:
      init-db:
        condition: service_completed_successfully