spring.application.name=zelourbano-api
server.port=${PORT:8080}

# Configuração Microsoft SQL Server via Variáveis de Ambiente
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=zelourbano_db;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:YourStrong!Passw0rd}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Evitar exposição de stacktrace em erros HTTP
server.error.include-stacktrace=never
server.error.include-message=always

# OpenAPI / Swagger
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html